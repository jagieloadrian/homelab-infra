apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: mon-home-ass
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/jagieloadrian/mon-home-ass
  ref:
    branch: main
  secretRef:
    name: flux-system
  ignore: |
    /*
    !/.devops/helm/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mon-home-ass
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./.devops/helm
  prune: true
  targetNamespace: apps
  sourceRef:
    kind: GitRepository
    name: mon-home-ass
