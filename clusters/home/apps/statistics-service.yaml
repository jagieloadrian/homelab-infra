# Rejestracja aplikacji: cp _app.yaml.example <app>.yaml && sed -i 's/statistics-service/<app>/g' <app>.yaml
# Flux czyta (read-only) katalog .devops/helm/ (HelmRelease na charts/app) z repo aplikacji i wdraża go do namespace apps.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: statistics-service
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/jagieloadrian/statistics-service
  ref:
    branch: main
  ignore: |
    /*
    !/.devops/helm/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: statistics-service
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./.devops/helm
  prune: true
  targetNamespace: apps
  sourceRef:
    kind: GitRepository
    name: statistics-service
  decryption:
    provider: sops
    secretRef:
      name: sops-age
