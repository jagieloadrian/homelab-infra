name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash  # -eo pipefail: błąd kustomize build nie ginie w potoku

env:
  KUBECONFORM_VERSION: v0.8.0
  # Kindy bez wariantu standalone (CustomResourceDefinition: rekurencyjny schemat); $ref pobierane po HTTPS
  K8S_SCHEMAS: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/{{.ResourceKind}}{{.KindSuffix}}.json
  # Schematy CRD (Flux, Istio, Gateway API) z katalogu datreeio
  CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

jobs:
  terraform:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        dir: [terraform/k3s, terraform/flux]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin kubeconform

      - name: Kubernetes manifests
        run: |
          kc() { kubeconform -strict -summary -ignore-filename-pattern 'kustomization\.yaml$' -schema-location default -schema-location "$K8S_SCHEMAS" -schema-location "$CRD_SCHEMAS" "$@"; }
          kustomize build infrastructure | kc -   # CRD Gateway API, Istio, Gateway, Postgres Service
          kc clusters/home                        # Flux Kustomizations, rejestracje aplikacji
          kc apps                                 # gotowe aplikacje (Helm)

      - name: Chart charts/app (własne aplikacje)
        run: |
          set -- --set image=ghcr.io/ci/ci:ci --set route.hostname=ci.home.arpa --set env.A=a --set secrets=true
          helm lint --strict charts/app "$@"
          helm template ci charts/app "$@" | kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" -

      - name: Flux substitution only for known variables
        run: |
          # Flux podstawia z ConfigMap cluster-vars (terraform/flux); nieznana zmienna = pusty string w klastrze
          unknown=$(kustomize build infrastructure | grep -o '\${[A-Za-z_][A-Za-z0-9_]*}' | sort -u | grep -vx '${WYSE_IP}' || true)
          [ -z "$unknown" ] || { echo "::error::nieznane zmienne Flux: $unknown (dodaj je do cluster-vars w terraform/flux)"; exit 1; }

      - name: new-app.sh
        run: |
          shellcheck scripts/*.sh
          scripts/new-app.sh own ci-smoke
          scripts/new-app.sh helm ci-smoke https://charts.example.com chart 1.x 8080
          scripts/new-app.sh helm ci-smoke-oci oci://ghcr.io/example/charts chart 1.x
          kubeconform -strict -summary -schema-location default -schema-location "$CRD_SCHEMAS" \
            clusters/home/apps/ci-smoke.yaml apps/ci-smoke apps/ci-smoke-oci

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: No Secret manifests in git
        run: |
          # sekrety tylko w Vault (docs/vault.md); w gicie ExternalSecret, nigdy Secret, nawet zaszyfrowany
          bad=$(git ls-files '*.yaml' '*.yml' '*.tpl' | xargs grep -lE '^kind: Secret$' || true)
          [ -z "$bad" ] || { echo "::error::kind: Secret w repo: $bad (wpisz do Vault, docs/vault.md)"; exit 1; }

      - name: No .env in git
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo "::error::.env jest w repo (ma zostać lokalnie, docs/setup.md krok 1)"; exit 1; fi
