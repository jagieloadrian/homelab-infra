apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
spec:
  interval: 24h
  url: https://nats-io.github.io/k8s/helm/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
spec:
  interval: 1h
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: nats
      version: '2.15.x'
      sourceRef:
        kind: HelmRepository
        name: nats
  values:
    global:
      labels:
        app.kubernetes.io/part-of: homelab
    config:
      jetstream:
        enabled: true
        fileStore:
          pvc:
            size: 2Gi
            storageClassName: local-path
          maxSize: 1Gi
        memoryStore:
          enabled: true
          maxSize: 32Mi
      merge:
        authorization:
          users:
            - user: statistics-service
              password: << $STATS_SERVICE_PASSWORD >>
              permissions:
                publish: ["$JS.API.>", "$JS.ACK.>", "_INBOX.>"]
                subscribe: ["stats.ingest.>", "_INBOX.>"]
            - user: collector
              password: << $COLLECTOR_PASSWORD >>
              permissions:
                publish: ["stats.ingest.>"]
                subscribe: ["_INBOX_collector.>"]
            - user: mon-home-ass
              password: << $MON_HOME_ASS_PASSWORD >>
              permissions:
                publish: ["stats.ingest.home-assistant"]
                subscribe: ["_INBOX_mon_home_ass.>"]
    container:
      env:
        GOMEMLIMIT: 200MiB
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 256Mi
      merge:
        envFrom:
          - secretRef:
              name: nats-auth
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    reloader:
      enabled: false
    podTemplate:
      configChecksumAnnotation: true
      merge:
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            homelab/node: rpi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
    serviceAccount:
      enabled: true
      merge:
        automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
    natsBox:
      enabled: false
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: nats-auth
  dataFrom:
    - extract:
        key: apps/nats
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: nats
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: nats
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/apps/sa/statistics-service
              - cluster.local/ns/apps/sa/mon-home-ass
      to:
        - operation:
            ports: ["4222"]
