# NATS z JetStream: kolejka dla statistics-service (docs/nats.md). Wygenerowane przez scripts/new-app.sh.
# Do sprawdzenia: helm show values / helm template nats --repo https://nats-io.github.io/k8s/helm/charts/ --version '2.15.x'
# Ruch tylko w klastrze: nats.apps.svc.cluster.local:4222 (TCP, bez HTTPRoute).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
spec:
  interval: 24h
  url: https://nats-io.github.io/k8s/helm/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
spec:
  interval: 1h
  chart:
    spec:
      chart: nats
      version: '2.15.x' # zakres semver (np. 1.2.x): Flux sam instaluje nowe wydania z zakresu
      sourceRef:
        kind: HelmRepository
        name: nats
  values:
    global:
      labels:
        app.kubernetes.io/part-of: homelab
    config:
      jetstream:
        enabled: true
        fileStore:
          pvc:
            size: 2Gi
            storageClassName: local-path
          maxSize: 1Gi
        memoryStore:
          enabled: true
          maxSize: 32Mi
      merge:
        # Hasła z Secret nats-auth (apps/nats/secret.sops.yaml) przez zmienne środowiskowe.
        # Brak no_auth_user = połączenie anonimowe odrzucone.
        authorization:
          users:
            - user: statistics-service
              password: << $STATS_SERVICE_PASSWORD >>
              permissions:
                publish: ["$JS.API.>", "$JS.ACK.>", "_INBOX.>"]
                subscribe: ["stats.ingest.>", "_INBOX.>"]
            - user: collector
              password: << $COLLECTOR_PASSWORD >>
              permissions:
                publish: ["stats.ingest.>"]
                # własny prefiks inboxa: _INBOX.> pokazałby wiadomości dostarczane do statistics-service
                subscribe: ["_INBOX_collector.>"]
    container:
      env:
        GOMEMLIMIT: 200MiB
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 256Mi
      merge:
        envFrom:
          - secretRef:
              name: nats-auth
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
    # ponytail: bez reloadera (sidecar + shareProcessNamespace); zmiana konfigu = rollout przez checksum.
    reloader:
      enabled: false
    podTemplate:
      configChecksumAnnotation: true
      merge:
        spec:
          automountServiceAccountToken: false
          nodeSelector:
            homelab/node: rpi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
    serviceAccount:
      enabled: true
      merge:
        automountServiceAccountToken: false
    podDisruptionBudget:
      enabled: false
    natsBox:
      enabled: false
---
# Monitoring (8222) zostaje w środku: tylko port 4222 i tylko od wymienionych kont.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: nats
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: nats
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/apps/sa/statistics-service
              # collectory w klastrze: cluster.local/ns/apps/sa/<collector>
      to:
        - operation:
            ports: ["4222"]
