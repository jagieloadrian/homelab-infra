# Wspólne źródło sekretów dla namespace apps: Vault secret/apps/<app> (KV v2), docs/vault.md.
# ESO loguje się do Vault tokenem tego konta (auth kubernetes, rola apps z polityką tylko do odczytu).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: apps
          serviceAccountRef:
            name: vault-reader
