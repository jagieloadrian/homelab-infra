apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hashicorp
  namespace: vault
spec:
  interval: 24h
  url: https://helm.releases.hashicorp.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 1h
  chart:
    spec:
      chart: vault
      version: 0.34.x
      sourceRef:
        kind: HelmRepository
        name: hashicorp
  values:
    injector:
      enabled: false
    server:
      standalone:
        enabled: true
      dataStorage:
        size: 1Gi
        storageClass: local-path
      nodeSelector:
        homelab/node: rpi
      readinessProbe:
        path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
    ui:
      enabled: true
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 24h
  url: https://charts.external-secrets.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 1h
  chart:
    spec:
      chart: external-secrets
      version: 2.x
      sourceRef:
        kind: HelmRepository
        name: external-secrets
